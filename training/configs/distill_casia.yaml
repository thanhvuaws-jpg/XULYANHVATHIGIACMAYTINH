# Chung cat tri thuc tren CASIA-WebFace + LFW
#   FaceNet (thay, 107 MB) -> MobileFaceNet (tro, 4.8 MB)
#
#   python -m training.distill --config training/configs/distill_casia.yaml
#
# Vi sao chung cat hop hon ArcFace o day:
#   - hoi tu nhanh hon nhieu (hoi quy 512 chieu, khong phai phan loai 6000 lop)
#   - khong can nhan -> gop duoc nhieu nguon du lieu vao lam mot
#   - ArcFace tren CASIA 18 epoch (2.1 gio) van chua hoi tu (acc_cls chi 0.30)

manifest: data/manifest_big.json
extra_dirs:
  - data/aligned_all              # LFW da align, da loc danh tinh val/test/stranger
recordio_dir: data/kaggle/casia/casia-webface
recordio_num_ids: 6000
recordio_max_per_id: 18           # 6000 x 18 = ~108k anh

out_dir: models
name: mobilefacenet_distill_casia
cache: data/teacher_casia.npz

image_size: 112
embedding_dim: 512

epochs: 12                        # distill hoi tu som; LFW da dat 0.90 tu epoch 10
batch_size: 64
lr: 0.05
momentum: 0.9
weight_decay: 0.0005
warmup_iters: 400

augment_strength: 1.0
workers: 0
seed: 42
