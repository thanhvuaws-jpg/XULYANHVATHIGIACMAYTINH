# nginx phục vụ giao diện web và chuyển tiếp /api sang backend.
#
# Vì sao đặt nginx trước mặt thay vì cho trình duyệt gọi thẳng backend:
#
#   1. **Cùng một gốc (same-origin).** Trình duyệt thấy giao diện và API đều nằm ở
#      cùng một gốc (mặc định http://localhost:8090) nên không có yêu cầu chéo gốc — không cần CORS, không
#      cần preflight OPTIONS trước mỗi lần gọi.
#   2. **Chỉ mở một cổng ra ngoài.** Backend không cần lộ cổng 8000 ra máy chủ;
#      nó chỉ nói chuyện với nginx trong mạng nội bộ của Docker.
#   3. **Tệp tĩnh do nginx trả.** Uvicorn là máy chủ ứng dụng, để nó phục vụ ảnh
#      và JavaScript là phí. nginx làm việc đó tốt hơn nhiều lần.

# Bảng tra cho việc nâng cấp WebSocket. Trình duyệt gửi "Connection: Upgrade" khi
# muốn mở WebSocket; mọi request HTTP thường thì không. Khối map này biến điều đó
# thành giá trị đúng cho header gửi sang backend.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Ảnh đăng ký gửi lên theo lô: mặc định 1 MB của nginx là quá nhỏ, 20 ảnh
    # điện thoại đã vượt ngay. Giới hạn này phải ≥ giới hạn phía backend.
    client_max_body_size 25m;

    # Không quảng cáo phiên bản nginx trong header Server.
    server_tokens off;

    # Nén phần văn bản. Ảnh JPEG/PNG đã nén sẵn nên không đưa vào danh sách.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml font/woff2;

    # ---------------------------------------------------------------- bảo mật
    add_header X-Content-Type-Options nosniff        always;
    add_header X-Frame-Options        SAMEORIGIN     always;
    add_header Referrer-Policy        no-referrer    always;

    # ------------------------------------------------------------------- API
    location /api/ {
        proxy_pass http://backend:8000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cho phép nâng cấp lên WebSocket (đường /api/ws đẩy sự kiện điểm danh
        # xuống trình duyệt). Thiếu hai header này thì nginx coi đó là một request
        # HTTP thường, và trình duyệt nhận 200 thay vì 101 — WebSocket không mở
        # được, nhưng KHÔNG có lỗi nào rõ ràng để lần ra nguyên nhân.
        #
        # $connection_upgrade lấy từ khối map ở đầu tệp: nó trả "upgrade" khi
        # trình duyệt xin nâng cấp và "close" trong mọi trường hợp còn lại. Đặt
        # cứng "upgrade" sẽ phá các request thường đi chung location này.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Nhận diện một ảnh mất khoảng 40–120 ms, nhưng nạp lại chỉ mục hoặc
        # trích lại đặc trưng cho toàn bộ người có thể chạy hàng chục giây.
        # Mặc định 60s của nginx sẽ cắt ngang giữa chừng.
        proxy_connect_timeout 10s;
        proxy_send_timeout   300s;
        # Đủ dài cho cả hai việc: lời gọi API nặng (nạp lại chỉ mục) và kết nối
        # WebSocket im lặng giữa hai lần điểm danh. Trình duyệt vẫn gửi nhịp giữ
        # kết nối mỗi 25 giây nên thực tế không bao giờ chạm tới mốc này — nhưng
        # nếu nhịp đó hỏng thì đây là lưới đỡ cuối cùng.
        proxy_read_timeout   3600s;

        # Xuất CSV là luồng dữ liệu (StreamingResponse); đệm lại sẽ giữ toàn bộ
        # tệp trong bộ nhớ nginx rồi mới trả — tắt đi để dữ liệu chảy thẳng.
        proxy_buffering off;
    }

    # Swagger UI — tiện lúc chấm bài và gỡ lỗi.
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # -------------------------------------------------------------- tệp tĩnh
    # Vite gắn mã băm vào tên tệp (index-a1b2c3d4.js). Tên đổi mỗi lần nội dung
    # đổi, nên đệm vĩnh viễn là an toàn và trang tải lại gần như tức thì.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html thì KHÔNG được đệm: tên nó cố định mà nội dung trỏ tới bản build
    # mới. Đệm nó là người dùng mắc kẹt ở phiên bản cũ sau khi triển khai.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Ứng dụng một trang: /attendance, /persons… là đường dẫn của React Router,
    # trên đĩa không có tệp nào tên như vậy. Trả index.html để React tự định tuyến;
    # thiếu dòng này thì bấm F5 ở trang con sẽ ra lỗi 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
